# Decap CMS configuration for Safe Space - Notts CIC
#
# AUTH: This file intentionally contains no usernames or passwords.
# Editors log in with their own GitHub account, via the OAuth gateway
# at base_url below (see README.md in this folder for how that gateway
# was set up). Access is granted by adding someone as a collaborator on
# this GitHub repository — there is no shared site-wide password
# anywhere in this repository.

backend:
  name: github
  repo: Drew-Junior/safe-space
  branch: main
  base_url: https://decap-cms-oauth-wheat-two.vercel.app

media_folder: "assets/img"
public_folder: "/assets/img"

publish_mode: editorial_workflow

collections:

  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/settings.json"
        label: "Global Settings (Nav, Contact, Footer)"
        name: "settings"
        fields:
          - { label: "Organisation Name", name: "org_name", widget: "string" }
          - { label: "Short Name (used in header)", name: "org_short", widget: "string" }
          - { label: "Company Registration Number", name: "reg_number", widget: "string" }
          - { label: "Legal Entity Type", name: "entity_type", widget: "string" }
          - { label: "Facility Address", name: "address", widget: "string" }
          - { label: "Contact Email", name: "email", widget: "string" }
          - { label: "WhatsApp Number (for the floating chat button)", name: "whatsapp_number", widget: "string", required: false, hint: "Digits only, with country code, no plus sign or spaces — e.g. 233201234567. Leave empty to hide the floating WhatsApp button." }
          - { label: "Logo Image", name: "logo_image", widget: "image", required: false, hint: "Square image works best (PNG or SVG with a transparent background). Leave empty to keep the default drawn mark." }
          - { label: "Homepage Hero Background Image", name: "hero_image", widget: "image", required: false, hint: "Used if the slideshow list below is empty. Wide photo, works best around 1920x1080." }
          - label: "Homepage Hero Slideshow (optional — overrides the single image above)"
            name: "hero_images"
            widget: "list"
            required: false
            hint: "Add two or more images for an automatic crossfade slideshow. Leave empty to use the single Hero Background Image above, or leave both empty for the default brand gradient."
            field: { label: "Image", name: "image", widget: "image" }
          - { label: "Homepage About Section Image", name: "about_image", widget: "image", required: false, hint: "Roughly square or portrait photo. Leave empty to keep the default brand gradient panel." }
          - { label: "Homepage CTA Band Background Image (the 'Bring your organisation into the pipeline' box)", name: "cta_band_image", widget: "image", required: false, hint: "Wide photo works best. Leave empty to keep the default brand gradient." }
          - label: "Social Links"
            name: "socials"
            widget: "list"
            hint: "Add one entry per platform. The footer shows each platform's first two letters as a circular link."
            fields:
              - { label: "Platform", name: "platform", widget: "string" }
              - { label: "Profile URL", name: "url", widget: "string" }
          - label: "Navigation Links"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link (href)", name: "href", widget: "string" }
          - { label: "Header CTA Button Label", name: "cta_label", widget: "string" }
          - { label: "Header CTA Button Link", name: "cta_href", widget: "string" }

  - name: "events"
    label: "Programs & Events"
    files:
      - file: "content/events.json"
        label: "Upcoming Events List"
        name: "events"
        fields:
          - label: "Events"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Heritage Hub", "SOS Framework", "Early Years"]
              - { label: "Date", name: "date", widget: "date" }
              - { label: "Image (optional)", name: "image", widget: "image", required: false }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "Location", name: "location", widget: "string" }

  - name: "activities"
    label: "Featured Activities"
    files:
      - file: "content/activities.json"
        label: "Activities List"
        name: "activities"
        fields:
          - label: "Activities"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Emoji Icon (used if no photo is set)", name: "icon", widget: "string", required: false }
              - { label: "Photo (optional — replaces the icon if set)", name: "image", widget: "image", required: false }

  - name: "board"
    label: "Board of Directors"
    files:
      - file: "content/board.json"
        label: "Directors & Photos"
        name: "board"
        fields:
          - label: "Directors"
            name: "directors"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Key (do not change)", name: "key", widget: "string", hint: "Must stay as 'nancy' or 'christina' — it links this entry to the right portfolio page." }
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Credential (optional)", name: "credential", widget: "string", required: false }
              - { label: "Role / Title", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Portfolio Page Link", name: "portfolio_href", widget: "string" }
              - label: "Social Links (optional)"
                name: "socials"
                widget: "list"
                required: false
                fields:
                  - { label: "Platform", name: "platform", widget: "string" }
                  - { label: "Profile URL", name: "url", widget: "string" }

  - name: "gallery"
    label: "Gallery"
    files:
      - file: "content/gallery.json"
        label: "Gallery Images"
        name: "gallery"
        fields:
          - label: "Images"
            name: "items"
            widget: "list"
            summary: "{{fields.category}} — {{fields.title}}"
            fields:
              - { label: "Title / Caption", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Heritage Hub", "Facility"]
              - { label: "Image", name: "image", widget: "image" }

  - name: "videos"
    label: "Gallery Videos"
    files:
      - file: "content/videos.json"
        label: "Videos"
        name: "videos"
        fields:
          - label: "Videos"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "YouTube Video ID", name: "youtube_id", widget: "string", required: false, hint: "The part after v= in a YouTube URL — e.g. for youtube.com/watch?v=dQw4w9WgXcQ, use dQw4w9WgXcQ. Leave blank to keep this entry hidden." }
              - { label: "Custom Thumbnail (optional)", name: "thumbnail", widget: "image", required: false, hint: "Leave empty to use YouTube's own thumbnail automatically." }
