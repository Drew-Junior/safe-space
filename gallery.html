<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Safe Space - Notts CIC</title>
<meta name="description" content="Photos from the Heritage Hub and our Nottingham facility.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Netlify Identity: must be present on every page, not just /admin/, so that
     invite/recovery links (which land on the site root) can catch the token in
     the URL and prompt the user to set their password. Harmless no-op on other hosts. -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body data-page="gallery.html">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" id="site-header" aria-label="Primary navigation"></header>

<main id="main">
  <section class="page-header">
    <div class="floating-shapes" aria-hidden="true">
      <span class="shape shape-circle c1"></span>
      <span class="shape shape-circle c2"></span>
      <span class="shape shape-circle c3"></span>
      <span class="shape shape-circle c4"></span>
      <svg class="shape shape-curve curve1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path d="M10,100 Q60,20 110,100 T190,100" stroke="#76CD26" stroke-width="6" fill="none" stroke-linecap="round"/>
      </svg>
      <svg class="shape shape-curve curve2" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path d="M10,60 Q80,140 190,60" stroke="#C000E0" stroke-width="6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="container">
      <p class="eyebrow">Gallery</p>
      <h1>Inside Safe Space - Notts CIC</h1>
      <p class="lede">A look at the Heritage Hub and our Nottingham facility. New images are added by our team through the CMS dashboard.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="filter-tabs" id="filter-tabs" role="tablist" aria-label="Filter gallery by category">
        <button class="filter-tab active" data-filter="All">All</button>
      </div>
      <div class="gallery-grid" id="gallery-grid">
        <p class="state-msg">Loading gallery&hellip;</p>
      </div>
    </div>
  </section>

  <section class="section-alt" id="videos-section" style="display:none;">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow">Videos</p>
        <h2>Watch Safe Space in Action</h2>
      </div>
      <div class="video-grid" id="video-grid"></div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close viewer">&times;</button>
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-video" id="lightbox-video"></div>
</div>

<footer class="site-footer reveal" id="site-footer" aria-label="Site footer"></footer>

<script src="js/social-icons.js"></script>
<script src="js/partials.js"></script>
<script src="js/floating-buttons.js"></script>
<script src="js/main.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
